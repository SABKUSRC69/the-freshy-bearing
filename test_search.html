<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ทดสอบระบบค้นหา - Freshy Bearing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a14; color: #eee; padding: 30px; }
        h1 { color: #e2be73; margin-bottom: 10px; }
        .info { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 14px; line-height: 1.8; }
        .info .ok { color: #5cb85c; font-weight: bold; }
        .info .err { color: #d9534f; font-weight: bold; }
        .search-box { display: flex; gap: 10px; margin: 20px 0; }
        .search-box input { flex: 1; padding: 12px 16px; font-size: 16px; border: 2px solid #e2be73; border-radius: 6px; background: #111; color: #eee; }
        .search-box button { padding: 12px 24px; background: #e2be73; color: #0a0a14; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .results { margin-top: 15px; }
        .card { background: #111; border: 1px solid #333; padding: 15px; border-radius: 8px; margin: 8px 0; }
        .card .name { font-size: 18px; font-weight: bold; color: #e2be73; }
        .card .detail { font-size: 14px; color: #aaa; margin-top: 5px; }
        .card.staff { border-color: #e2be73; }
        #log { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>🔍 ทดสอบระบบค้นหา Freshy Bearing</h1>
    <p style="color:#aaa;">หน้านี้ทดสอบว่าฐานข้อมูลและระบบค้นหาทำงานถูกต้องหรือไม่</p>

    <div class="info" id="diagnostics">กำลังโหลด...</div>

    <div class="search-box">
        <input type="text" id="test-input" placeholder="กรอกรหัสนิสิต 10 หลัก เช่น 6930100013 หรือ 6730157135" maxlength="10">
        <button onclick="doSearch()">ค้นหา</button>
    </div>

    <div class="results" id="results"></div>

    <h3 style="margin-top:20px; color:#e2be73;">📋 บันทึกการทำงาน (Debug Log)</h3>
    <div id="log"></div>

    <!-- Load the SAME data.js file -->
    <script src="assets/js/data.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const diagEl = document.getElementById('diagnostics');
        
        function log(msg) {
            const time = new Date().toLocaleTimeString('th-TH');
            logEl.textContent += `[${time}] ${msg}\n`;
            console.log(msg);
        }

        // === DIAGNOSTICS ===
        let diagHTML = '';
        
        // Check STUDENT_DATA
        if (typeof STUDENT_DATA !== 'undefined') {
            log(`✅ STUDENT_DATA loaded: ${STUDENT_DATA.length} records`);
            diagHTML += `<span class="ok">✅ STUDENT_DATA:</span> ${STUDENT_DATA.length} รายชื่อนิสิตใหม่<br>`;
            
            // Show first 3 records as proof
            log(`   First record: ID=${STUDENT_DATA[0][0]}, Name=${STUDENT_DATA[0][1]}${STUDENT_DATA[0][2]} ${STUDENT_DATA[0][3]}`);
            log(`   Last record: ID=${STUDENT_DATA[STUDENT_DATA.length-1][0]}, Name=${STUDENT_DATA[STUDENT_DATA.length-1][1]}${STUDENT_DATA[STUDENT_DATA.length-1][2]} ${STUDENT_DATA[STUDENT_DATA.length-1][3]}`);
        } else {
            log(`❌ STUDENT_DATA is UNDEFINED - data.js failed to load!`);
            diagHTML += `<span class="err">❌ STUDENT_DATA:</span> ไม่พบฐานข้อมูลนิสิต! ไฟล์ data.js ไม่ได้โหลด<br>`;
        }

        // Check STAFF_DATA
        if (typeof STAFF_DATA !== 'undefined') {
            const staffCount = STAFF_DATA.filter(r => r.role === 'staff').length;
            const subcommCount = STAFF_DATA.filter(r => r.role === 'subcommittee').length;
            const advisorCount = STAFF_DATA.filter(r => r.role === 'advisor').length;
            log(`✅ STAFF_DATA loaded: ${STAFF_DATA.length} records (staff=${staffCount}, subcomm=${subcommCount}, advisor=${advisorCount})`);
            diagHTML += `<span class="ok">✅ STAFF_DATA:</span> ${STAFF_DATA.length} ทีมงาน (สตาฟ ${staffCount}, อนุกรรมการ ${subcommCount}, ที่ปรึกษา ${advisorCount})<br>`;
            
            // Check for 6730157135 specifically
            const target = STAFF_DATA.find(r => String(r.id) === '6730157135');
            if (target) {
                log(`✅ ID 6730157135 FOUND in STAFF_DATA: ${target.prefix}${target.name} ${target.surname} (${target.position})`);
                diagHTML += `<span class="ok">✅ รหัส 6730157135:</span> พบ! ${target.prefix}${target.name} ${target.surname} - ${target.position}<br>`;
            } else {
                log(`❌ ID 6730157135 NOT FOUND in STAFF_DATA`);
                diagHTML += `<span class="err">❌ รหัส 6730157135:</span> ไม่พบในฐานข้อมูลสตาฟ<br>`;
            }
        } else {
            log(`❌ STAFF_DATA is UNDEFINED`);
            diagHTML += `<span class="err">❌ STAFF_DATA:</span> ไม่พบฐานข้อมูลสตาฟ<br>`;
        }

        // Check if app.js or app3.js loaded
        diagHTML += `<br><b>ข้อมูลเบราว์เซอร์:</b><br>`;
        diagHTML += `URL: ${window.location.href}<br>`;
        diagHTML += `Protocol: ${window.location.protocol}<br>`;
        diagHTML += `User Agent: ${navigator.userAgent.substring(0, 80)}...<br>`;
        
        diagEl.innerHTML = diagHTML;

        // === SEARCH FUNCTION ===
        function doSearch() {
            const query = document.getElementById('test-input').value.trim();
            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = '';
            
            log(`--- Search for: "${query}" ---`);
            
            if (!query) {
                resultsEl.innerHTML = '<div class="card">กรุณากรอกรหัสนิสิต</div>';
                return;
            }
            
            if (!/^\d{10}$/.test(query)) {
                resultsEl.innerHTML = '<div class="card">กรุณากรอกรหัสนิสิตให้ครบ 10 หลัก (ตัวเลขเท่านั้น)</div>';
                log(`Invalid format: "${query}" is not 10 digits`);
                return;
            }
            
            let found = false;
            
            // Search STUDENT_DATA
            if (typeof STUDENT_DATA !== 'undefined') {
                const studentMatch = STUDENT_DATA.filter(row => String(row[0]) === query);
                log(`Student search: ${studentMatch.length} results`);
                
                studentMatch.forEach(row => {
                    found = true;
                    resultsEl.innerHTML += `
                        <div class="card">
                            <div class="name">🎓 ${row[1]}${row[2]} ${row[3]}</div>
                            <div class="detail">รหัสนิสิต: ${row[0]} | สาขา: ${row[4]} | แผน: ${row[5]}</div>
                            <div class="detail" style="color:#5cb85c; margin-top:8px;">✅ พบในฐานข้อมูลนิสิตใหม่</div>
                        </div>
                    `;
                });
            }
            
            // Search STAFF_DATA
            if (typeof STAFF_DATA !== 'undefined') {
                const staffMatch = STAFF_DATA.filter(row => String(row.id) === query);
                log(`Staff search: ${staffMatch.length} results`);
                
                staffMatch.forEach(row => {
                    found = true;
                    resultsEl.innerHTML += `
                        <div class="card staff">
                            <div class="name">⭐ ${row.prefix}${row.name} ${row.surname}${row.nickname ? ' (' + row.nickname + ')' : ''}</div>
                            <div class="detail">รหัส: ${row.id} | ตำแหน่ง: ${row.position} | ประเภท: ${row.role}</div>
                            <div class="detail" style="color:#e2be73; margin-top:8px;">✅ พบในฐานข้อมูลทีมงาน</div>
                        </div>
                    `;
                });
            }
            
            if (!found) {
                resultsEl.innerHTML = `<div class="card"><span style="color:#d9534f;">❌ ไม่พบรหัส "${query}" ในฐานข้อมูลทั้ง 2 ฐาน</span></div>`;
                log(`No results found for "${query}"`);
            }
        }
        
        // Also trigger search on Enter key
        document.getElementById('test-input').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') doSearch();
        });
        
        log('Test page ready.');
    </script>
</body>
</html>
